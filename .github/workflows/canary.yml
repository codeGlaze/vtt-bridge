name: Selector canary

# Weekly check that the DMV selectors this extension depends on still exist
# on the live site. The live-site probe is the alarm (fails the workflow);
# the dev-site probe is informational only, since the beta site is allowed
# to drift ahead of production.

on:
  schedule:
    # 06:17 UTC every Monday -- off-peak, avoids the top-of-hour rush of
    # other scheduled Actions jobs.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0 npx playwright install --with-deps chromium

      - name: Probe live site selectors
        run: npm run probe:live

      - name: Probe dev site selectors
        if: always()
        continue-on-error: true
        run: npm run probe:live -- --dev
