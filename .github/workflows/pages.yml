name: Deploy Owlbear extension to GitHub Pages

# Builds owlbear-extension/ and publishes dist/ to GitHub Pages whenever a
# push to main touches that directory (or this workflow itself).
#
# One-time setup required: in the repo's Settings -> Pages, set
# "Source" to "GitHub Actions". Once that's done, the extension's
# installable manifest URL will be:
#
#   https://<owner>.github.io/vtt-bridge/manifest.json
#
# owlbear-extension/manifest.json and background.html use relative paths
# (no leading "/") specifically so the built extension works correctly
# when served from that /vtt-bridge/ sub-path rather than a domain root.

on:
  push:
    branches: [main]
    paths:
      - "owlbear-extension/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: owlbear-extension/package-lock.json

      - name: Install dependencies
        working-directory: owlbear-extension
        run: npm ci

      - name: Build
        working-directory: owlbear-extension
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: owlbear-extension/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
