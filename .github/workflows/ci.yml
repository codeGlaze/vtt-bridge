name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build (Chrome)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Install Playwright browsers
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0 npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Validate Firefox build with addons-linter
        run: npx addons-linter .output/firefox-mv3

      - name: Zip (Chrome)
        run: npm run zip

      - name: Zip (Firefox)
        run: npm run zip:firefox

      - name: Upload extension zips
        uses: actions/upload-artifact@v4
        with:
          name: vtt-bridge-extension
          path: .output/*.zip
